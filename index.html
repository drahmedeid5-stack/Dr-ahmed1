<!-- قسم معرض الصور والفيديوهات التفاعلي -->
<section id="gallery-section" class="py-5 bg-light" style="direction: rtl;">
    <div class="container">
        <h2 class="text-center mb-4" style="color: #1a3a60; font-weight: bold;">معرض الصور والفيديوهات</h2>
        <div class="row" id="gallery-container">
            <!-- سيتم تحميل المحتوى أوتوماتيكياً من جوجل شيت -->
        </div>
    </div>
</section>

<!-- نافذة العرض المنبثقة (Lightbox) لتكبير الصور والفيديوهات -->
<div id="mediaModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div style="position:relative; max-width:90%; max-height:90%;">
        <span onclick="closeMediaModal()" style="position:absolute; top:-40px; right:0; color:white; font-size:35px; cursor:pointer; font-weight:bold;">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<script>
// دالة لجلب وعرض محتوى المعرض من الـ API
async function loadGallery() {
    try {
        const response = await fetch('رابط_الـ_Web_App_هنا?action=getDynamicContent'); // استبدل الرابط برابط الـ Web App الخاص بك
        const data = await response.json();
        if (data && data.gallery) {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            data.gallery.forEach(item => {
                let col = document.createElement('div');
                col.className = 'col-md-4 mb-4';
                
                let contentHTML = '';
                if (item.type === 'image') {
                    contentHTML = `
                        <div class="card h-100 shadow-sm" style="cursor:pointer;" onclick="openImageModal('${item.url}', '${item.title}')">
                            <img src="${item.url}" class="card-img-top" alt="${item.title}" style="height: 200px; object-fit: cover;">
                            <div class="card-body text-center"><h5 class="card-title" style="font-size: 16px;">${item.title}</h5></div>
                        </div>`;
                } else {
                    contentHTML = `
                        <div class="card h-100 shadow-sm">
                            <div class="card-body text-center d-flex flex-column justify-content-center align-items:center" style="height: 200px; background: #000; cursor:pointer;" onclick="openVideoModal('${item.url}')">
                                <i class="fas fa-play-circle fa-3x text-white mb-2"></i>
                                <h5 class="card-title text-white" style="font-size: 16px;">${item.title}</h5>
                            </div>
                        </div>`;
                }
                col.innerHTML = contentHTML;
                container.appendChild(col);
            });
        }
    } catch (e) {
        console.error('خطأ في تحميل المعرض', e);
    }
}

function openImageModal(url, title) {
    const modal = document.getElementById('mediaModal');
    const content = document.getElementById('modalContent');
    content.innerHTML = `<img src="${url}" style="max-width:100%; max-height:80vh; border-radius:8px;"><p class="text-white text-center mt-2">${title}</p>`;
    modal.style.display = 'flex';
}

function openVideoModal(url) {
    const modal = document.getElementById('mediaModal');
    const content = document.getElementById('modalContent');
    // دعم روابط اليوتيوب أو الروابط المباشرة
    let embedUrl = url.includes('watch?v=') ? url.replace('watch?v=', 'embed/') : url;
    content.innerHTML = `<iframe width="560" height="315" src="${embedUrl}" frameborder="0" allowfullscreen style="max-width:100%;"></iframe>`;
    modal.style.display = 'flex';
}

function closeMediaModal() {
    document.getElementById('mediaModal').style.display = 'none';
    document.getElementById('modalContent').innerHTML = '';
}

document.addEventListener("DOMContentLoaded", loadGallery);
</script>
