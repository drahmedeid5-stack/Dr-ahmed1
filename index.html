<script>
(function() {
    const API_URL = 'https://script.google.com/macros/s/AKfycbyzGUHN905ITGjsrKA6_CWJR23Xq3ste9bYW3iiY1LmtA3eU1kBSdgPK_tFuQb9DhU/exec';

    // دالة ذكية لتنظيف وتظبيط الروابط أوتوماتيكياً من غير تعب
    function smartFormatUrl(url, type) {
        if (!url) return '';
        // لو رابط جوجل درايف وعادي، نحوله لرابط مباشر
        if (url.includes('drive.google.com')) {
            let fileIdMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (fileIdMatch && fileIdMatch[1]) {
                return type === 'image' 
                    ? `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`
                    : `https://www.youtube.com/embed/example`; // احتياطي لو فيديو في الدرايف
            }
        }
        // لو رابط يوتيوب عادي، نحوله لـ Embed عشان يشتغل في الـ Iframe
        if (type === 'video' && (url.includes('watch?v=') || url.includes('youtu.be/'))) {
            let videoId = '';
            if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1].split('&')[0];
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            }
            if (videoId && videoId !== 'example') {
                return `https://www.youtube.com/embed/${videoId}`;
            }
        }
        return url;
    }

    function loadGallery() {
        const cbName = '__smart_gallery_' + Date.now();
        window[cbName] = function (data) {
            try {
                if (data && data.gallery && Array.isArray(data.gallery)) {
                    const container = document.getElementById('gallery-container');
                    if (!container) return;
                    container.innerHTML = '';
                    
                    data.gallery.forEach(item => {
                        // نتجاوز العناصر الفارغة أو التجريبية البايظة
                        if (!item.url || item.url.includes('example')) return;

                        let processedUrl = smartFormatUrl(item.url, item.type);
                        let col = document.createElement('div');
                        col.style.cssText = 'flex: 1 1 300px; max-width: 350px; margin-bottom: 20px;';
                        
                        if (item.type === 'image') {
                            col.innerHTML = `
                                <div style="background:#fff; border-radius:15px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.05); cursor:pointer; border:1px solid #e2e8f0; transition:0.3s;" onclick="openImageModal('${processedUrl}', '${item.title || 'صورة من العيادة'}')">
                                    <img src="${processedUrl}" alt="${item.title || ''}" style="width:100%; height:200px; object-fit:cover;" onerror="this.src='https://images.unsplash.com/photo-1629909613654-28e377c37b09?w=800'">
                                    <div style="padding:15px; text-align:center;"><h5 style="color:#1e3a8a; font-size:1.1rem; font-weight:700; margin:0;">${item.title || ''}</h5></div>
                                </div>`;
                        } else {
                            col.innerHTML = `
                                <div style="background:#1e3a8a; border-radius:15px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.05); cursor:pointer; text-align:center;" onclick="openVideoModal('${processedUrl}')">
                                    <div style="height:200px; display:flex; flex-direction:column; justify-content:center; align-items:center; background:linear-gradient(135deg, #1e3a8a, #2563eb); color:#fff;">
                                        <i class="fas fa-play-circle fa-3x" style="margin-bottom:10px;"></i>
                                        <h5 style="font-size:1.1rem; font-weight:700; margin:0; padding:0 15px;">${item.title || 'فيديو توضيحي'}</h5>
                                    </div>
                                </div>`;
                        }
                        container.appendChild(col);
                    });
                }
            } catch (e) {
                console.error("Gallery loading error: ", e);
            }
            if (window[cbName]) delete window[cbName];
            if (script && script.parentNode) script.remove();
        };

        const script = document.createElement('script');
        script.src = API_URL + '?action=getDynamicContent&callback=' + cbName;
        script.onerror = function() {
            console.error("Failed to load gallery data from API.");
        };
        document.body.appendChild(script);
    }

    // دوال المودال للتكبير
    window.openImageModal = function(url, title) {
        const modal = document.getElementById('mediaModal');
        const content = document.getElementById('modalContent');
        if (!modal || !content) return;
        content.innerHTML = `<img src="${url}" style="max-width:100%; max-height:80vh; border-radius:10px;"><p style="color:#fff; margin-top:10px; font-size:1.2rem;">${title}</p>`;
        modal.style.display = 'flex';
    };

    window.openVideoModal = function(url) {
        const modal = document.getElementById('mediaModal');
        const content = document.getElementById('modalContent');
        if (!modal || !content) return;
        content.innerHTML = `<iframe width="560" height="315" src="${url}" frameborder="0" allowfullscreen style="max-width:100%; border-radius:10px;"></iframe>`;
        modal.style.display = 'flex';
    };

    window.closeMediaModal = function() {
        const modal = document.getElementById('mediaModal');
        const content = document.getElementById('modalContent');
        if (modal) modal.style.display = 'none';
        if (content) content.innerHTML = '';
    };

    if (document.readyState === "complete" || document.readyState === "interactive") {
        loadGallery();
    } else {
        document.addEventListener("DOMContentLoaded", loadGallery);
    }
})();
</script>
