<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حجز موعد - عيادة دكتور أحمد عبد الرفاعي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f6f8;
            color: #1e2a3a;
            line-height: 1.8;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .booking-card {
            background: #ffffff;
            max-width: 650px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            border: 1px solid rgba(201, 154, 43, 0.15);
        }
        .booking-card h1 {
            font-size: 2rem;
            font-weight: 900;
            color: #1a3a60;
            text-align: center;
            margin-bottom: 6px;
        }
        .booking-card h1 i {
            color: #c99a2b;
            margin-left: 10px;
        }
        .booking-card .sub {
            text-align: center;
            color: #5a6a7a;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            color: #1a3a60;
            margin-bottom: 6px;
            font-size: 1rem;
        }
        .form-group label i {
            color: #c99a2b;
            margin-left: 8px;
            width: 20px;
        }
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e4e8;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            background: #f5f6f8;
            transition: 0.3s ease;
        }
        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #c99a2b;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(201, 154, 43, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .form-row .form-group {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
        }
        .branch-phone-display {
            background: #f5f6f8;
            padding: 10px 16px;
            border-radius: 12px;
            margin-top: 6px;
            font-weight: 600;
            color: #1a3a60;
            display: flex;
            align-items: center;
            gap: 12px;
            border-right: 4px solid #c99a2b;
        }
        .branch-phone-display i {
            color: #25d366;
            font-size: 1.2rem;
        }
        .btn-submit {
            display: block;
            width: 100%;
            background: #c99a2b;
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(201, 154, 43, 0.35);
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #b0861f;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(201, 154, 43, 0.5);
        }
        .btn-submit i {
            margin-left: 12px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #5a6a7a;
            font-weight: 600;
            transition: 0.3s ease;
        }
        .back-link a {
            color: #2a4a7a;
            text-decoration: none;
        }
        .back-link a:hover {
            color: #c99a2b;
        }
        .note-msg {
            background: #fff9e6;
            padding: 12px 18px;
            border-radius: 12px;
            border-right: 4px solid #c99a2b;
            font-size: 0.9rem;
            color: #5a6a7a;
            margin-bottom: 20px;
        }
        .note-msg i {
            color: #c99a2b;
            margin-left: 8px;
        }
        @media (max-width: 550px) {
            .booking-card {
                padding: 24px 18px;
            }
            .form-row .form-group {
                flex: 1 1 100%;
            }
            .booking-card h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="booking-card">
        <h1><i class="fas fa-calendar-check"></i> حجز موعد</h1>
        <p class="sub">اختر الفرع والموعد المناسب لك</p>
        <div class="note-msg">
            <i class="fas fa-info-circle"></i>
            سيتم إرسال بيانات حجزك عبر واتساب لتأكيد الموعد.
        </div>
        <form id="bookingForm" onsubmit="submitBooking(event)">
            <!-- اختيار الفرع -->
            <div class="form-group">
                <label><i class="fas fa-store"></i> اختر الفرع</label>
                <select id="branch" required>
                    <option value="">-- اختر --</option>
                    <option value="أكتوبر" data-phone="201061119615">فرع أكتوبر</option>
                    <option value="فيصل" data-phone="201032444727">فرع فيصل</option>
                </select>
                <div id="branchPhoneDisplay" class="branch-phone-display" style="display:none;">
                    <i class="fas fa-phone"></i>
                    <span>رقم الفرع: <span id="phoneNumberDisplay"></span></span>
                </div>
            </div>

            <!-- اليوم (يتغير بناءً على الفرع) -->
            <div class="form-group">
                <label><i class="fas fa-calendar-day"></i> اليوم</label>
                <select id="day" required>
                    <option value="">-- اختر الفرع أولاً --</option>
                </select>
            </div>

            <!-- الوقت (يتغير بناءً على اليوم) -->
            <div class="form-group">
                <label><i class="fas fa-clock"></i> الوقت</label>
                <select id="time" required>
                    <option value="">-- اختر اليوم أولاً --</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-user"></i> الاسم الكامل</label>
                <input type="text" id="name" placeholder="أدخل اسمك" required />
            </div>

            <div class="form-group">
                <label><i class="fas fa-phone"></i> رقم التليفون</label>
                <input type="tel" id="phone" placeholder="مثال: 01012345678" required />
            </div>

            <div class="form-group">
                <label><i class="fas fa-pen"></i> ملاحظات (اختياري)</label>
                <textarea id="notes" placeholder="أي تفاصيل إضافية تريد إخبارنا بها"></textarea>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fab fa-whatsapp"></i> تأكيد الحجز
            </button>
        </form>

        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-right"></i> العودة إلى الصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. روابط الـ APIs (غيّرها بالروابط الحقيقية بتاعتك)
        // ============================================================
        // رابط شيت إدارة الموقع (لجلب مواعيد العمل)
       const SITE_API_URL = 'https://script.google.com/macros/s/رابط_شيت_ادارة_الموقع/exec';
const BOOKING_API_URL = 'https://script.google.com/macros/s/رابط_شيت_الحجوزات/exec';
        // ============================================================
        // 2. متغيرات لتخزين البيانات
        // ============================================================
        let scheduleData = {}; // هتخزن كل المفاتيح والقيم من شيت إدارة الموقع

        // ============================================================
        // 3. جلب بيانات الموقع من شيت إدارة_الموقع
        // ============================================================
        async function loadSiteData() {
            try {
                const response = await fetch(SITE_API_URL);
                const data = await response.json();
                scheduleData = data;
                console.log('✅ تم تحميل بيانات الموقع:', scheduleData);
                return true;
            } catch (error) {
                console.error('❌ خطأ في تحميل بيانات الموقع:', error);
                return false;
            }
        }

        // ============================================================
        // 4. تحديث قائمة الأيام عند اختيار الفرع
        // ============================================================
        document.getElementById('branch').addEventListener('change', function() {
            const branch = this.value;
            const daySelect = document.getElementById('day');
            const timeSelect = document.getElementById('time');
            const phoneDisplay = document.getElementById('branchPhoneDisplay');
            const phoneSpan = document.getElementById('phoneNumberDisplay');

            // عرض رقم الفرع
            const selected = this.options[this.selectedIndex];
            const phone = selected.getAttribute('data-phone');
            if (phone) {
                phoneSpan.textContent = phone;
                phoneDisplay.style.display = 'flex';
            } else {
                phoneDisplay.style.display = 'none';
            }

            // إعادة تعيين القوائم
            daySelect.innerHTML = '';
            timeSelect.innerHTML = '<option value="">-- اختر اليوم أولاً --</option>';

            if (!branch || !scheduleData) {
                daySelect.innerHTML = '<option value="">-- اختر الفرع أولاً --</option>';
                return;
            }

            // تحديد المفتاح المناسب حسب الفرع
            let daysKey = '';
            let timesKey = '';
            if (branch === 'أكتوبر') {
                daysKey = 'days_october';
                timesKey = 'times_october';
            } else if (branch === 'فيصل') {
                daysKey = 'days_faisal';
                timesKey = 'times_faisal';
            } else {
                daySelect.innerHTML = '<option value="">-- اختر الفرع أولاً --</option>';
                return;
            }

            const daysValue = scheduleData[daysKey] || '';
            const timesValue = scheduleData[timesKey] || '';

            // لو مفيش أيام أو مكتوب "مغلق"
            if (!daysValue || daysValue.toLowerCase().includes('مغلق')) {
                daySelect.innerHTML = '<option value="">الفرع مغلق حالياً</option>';
                return;
            }

            // تقسيم الأيام والمواعيد
            const daysList = daysValue.split(',').map(item => item.trim()).filter(item => item);
            const timesList = timesValue.split(',').map(item => item.trim()).filter(item => item);

            if (daysList.length === 0) {
                daySelect.innerHTML = '<option value="">لا توجد أيام متاحة</option>';
                return;
            }

            // ملء قائمة الأيام
            daySelect.innerHTML = '<option value="">-- اختر اليوم --</option>';
            daysList.forEach(day => {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day;
                daySelect.appendChild(option);
            });

            // حفظ قائمة المواعيد لاستخدامها عند اختيار اليوم
            daySelect._timesList = timesList;
        });

        // ============================================================
        // 5. تحديث قائمة الأوقات عند اختيار اليوم
        // ============================================================
        document.getElementById('day').addEventListener('change', function() {
            const timeSelect = document.getElementById('time');
            const timesList = this._timesList || [];

            timeSelect.innerHTML = '';

            if (!this.value || timesList.length === 0) {
                timeSelect.innerHTML = '<option value="">-- اختر اليوم أولاً --</option>';
                return;
            }

            // ملء قائمة المواعيد
            timeSelect.innerHTML = '<option value="">-- اختر الوقت --</option>';
            timesList.forEach(time => {
                if (time) {
                    const option = document.createElement('option');
                    option.value = time;
                    option.textContent = time;
                    timeSelect.appendChild(option);
                }
            });
        });

        // ============================================================
        // 6. دالة إرسال الحجز (مع رقم الحجز ورسالة واتساب)
        // ============================================================
        async function submitBooking(e) {
            e.preventDefault();

            const branch = document.getElementById('branch');
            const branchName = branch.value;
            const branchPhone = branch.options[branch.selectedIndex].getAttribute('data-phone');
            const day = document.getElementById('day').value;
            const time = document.getElementById('time').value;
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!branchName || !day || !time || !name || !phone) {
                alert('يرجى ملء جميع الحقول المطلوبة.');
                return;
            }

            // ===== إرسال البيانات إلى Google Sheets (شيت الحجوزات) =====
            const bookingData = {
                branch: branchName,
                date: day,
                time: time,
                name: name,
                phone: phone,
                notes: notes
            };

            let bookingNumber = '';

            try {
                const response = await fetch(BOOKING_API_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });

                const result = await response.json();

                if (result.success) {
                    bookingNumber = result.bookingNumber || 'غير معروف';
                    console.log('✅ تم تسجيل الحجز، رقم الحجز:', bookingNumber);
                } else {
                    console.error('❌ خطأ في التسجيل:', result.error);
                }
            } catch (error) {
                console.error('❌ خطأ في الإرسال إلى Google Sheets:', error);
            }

            // ===== بناء رسالة واتساب مع رقم الحجز =====
            let message = `✅ تم تأكيد حجزك في عيادة دكتور أحمد عبد الرفاعي\n`;
            message += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            message += `🔹 رقم الحجز: #${bookingNumber}\n`;
            message += `🏥 الفرع: ${branchName}\n`;
            message += `📅 اليوم: ${day}\n`;
            message += `⏰ الوقت: ${time}\n`;
            message += `👤 الاسم: ${name}\n`;
            message += `📞 رقم الهاتف: ${phone}\n`;
            if (notes) {
                message += `📝 ملاحظات: ${notes}\n`;
            }
            message += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            message += `📌 يرجى الاحتفاظ برقم الحجز لتأكيد موعدك.\n`;
            message += `📞 للاستفسار: 01032444727 / 01061119615`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${branchPhone}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');

            alert(`✅ تم تسجيل حجزك بنجاح!\n📌 رقم الحجز: #${bookingNumber}\n📱 سيتم فتح واتساب لإرسال التفاصيل.`);
        }

        // ============================================================
        // 7. تشغيل تحميل البيانات عند تحميل الصفحة
        // ============================================================
        window.onload = async function() {
            // تعطيل حقول الفرع مؤقتاً حتى تتحمل البيانات
            document.getElementById('branch').disabled = true;
            const loaded = await loadSiteData();
            document.getElementById('branch').disabled = false;
            if (!loaded) {
                alert('حدث خطأ في تحميل مواعيد العمل. يرجى تحديث الصفحة أو المحاولة لاحقاً.');
            }
        };
    </script>
</body>
</html>
