<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حجز موعد - عيادة دكتور أحمد عيد رفاعي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f6f8;
            color: #1e2a3a;
            line-height: 1.8;
            direction: rtl;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 20px;
        }

        .booking-card {
            background: #ffffff;
            max-width: 650px;
            width: 100%;

            padding: 40px 35px;

            border-radius: 24px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);

            border: 1px solid rgba(201, 154, 43, 0.15);
        }

        .booking-card h1 {
            font-size: 2rem;
            font-weight: 900;
            color: #1a3a60;

            text-align: center;

            margin-bottom: 6px;
        }

        .booking-card h1 i {
            color: #c99a2b;
            margin-left: 10px;
        }

        .booking-card .sub {
            text-align: center;
            color: #5a6a7a;

            font-size: 1rem;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            font-weight: 700;

            color: #1a3a60;

            margin-bottom: 6px;

            font-size: 1rem;
        }

        .form-group label i {
            color: #c99a2b;

            margin-left: 8px;

            width: 20px;
        }

        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 12px 16px;

            border: 2px solid #e0e4e8;

            border-radius: 12px;

            font-family: 'Cairo', sans-serif;

            font-size: 1rem;

            background: #f5f6f8;

            transition: 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #c99a2b;

            outline: none;

            background: #fff;

            box-shadow: 0 0 0 4px rgba(201, 154, 43, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .branch-phone-display {
            background: #f5f6f8;

            padding: 10px 16px;

            border-radius: 12px;

            margin-top: 6px;

            font-weight: 600;

            color: #1a3a60;

            display: flex;

            align-items: center;

            gap: 12px;

            border-right: 4px solid #c99a2b;
        }

        .branch-phone-display i {
            color: #25d366;
            font-size: 1.2rem;
        }

        .btn-submit {
            display: block;

            width: 100%;

            background: #c99a2b;

            color: #fff;

            padding: 16px;

            border: none;

            border-radius: 50px;

            font-weight: 700;

            font-size: 1.2rem;

            cursor: pointer;

            transition: 0.3s ease;

            box-shadow: 0 6px 20px rgba(201, 154, 43, 0.35);

            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #b0861f;

            transform: translateY(-3px);

            box-shadow: 0 12px 30px rgba(201, 154, 43, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit i {
            margin-left: 12px;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #5a6a7a;

            font-weight: 600;
        }

        .back-link a {
            color: #2a4a7a;

            text-decoration: none;
        }

        .back-link a:hover {
            color: #c99a2b;
        }

        .note-msg {
            background: #fff9e6;

            padding: 12px 18px;

            border-radius: 12px;

            border-right: 4px solid #c99a2b;

            font-size: 0.9rem;

            color: #5a6a7a;

            margin-bottom: 20px;
        }

        .note-msg i {
            color: #c99a2b;

            margin-left: 8px;
        }

        /* رسالة تحميل المواعيد */
        .loading-msg {
            margin-top: 8px;

            padding: 10px 14px;

            background: #eef5fb;

            border-right: 4px solid #1a3a60;

            border-radius: 10px;

            color: #1a3a60;

            font-size: 0.9rem;

            display: none;
        }

        .loading-msg i {
            margin-left: 6px;
        }

        /* رسالة اكتمال اليوم */
        .full-day-msg {
            margin-top: 8px;

            padding: 12px 16px;

            background: #fff0f0;

            border-right: 4px solid #d9534f;

            border-radius: 10px;

            color: #a52a2a;

            font-weight: 700;

            font-size: 0.92rem;

            display: none;
        }

        .full-day-msg i {
            margin-left: 7px;
        }

        /* رسالة عدم وجود مواعيد */
        .empty-day-msg {
            margin-top: 8px;

            padding: 12px 16px;

            background: #f5f6f8;

            border-right: 4px solid #777;

            border-radius: 10px;

            color: #555;

            font-weight: 600;

            font-size: 0.92rem;

            display: none;
        }

        .empty-day-msg i {
            margin-left: 7px;
        }

        /* إخفاء العناصر المعطلة */
        select:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* على الموبايل */
        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .booking-card {
                padding: 28px 20px;
                border-radius: 18px;
            }

            .booking-card h1 {
                font-size: 1.6rem;
            }

            .booking-card .sub {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

<div class="booking-card">

    <h1>
        <i class="fas fa-calendar-check"></i>
        حجز موعد
    </h1>

    <p class="sub">
        اختر الفرع والموعد المناسب لك
    </p>

    <div class="note-msg">
        <i class="fas fa-info-circle"></i>
        سيتم إرسال بيانات حجزك عبر واتساب لتأكيد الموعد.
    </div>

    <form id="bookingForm" onsubmit="submitBooking(event)">

        <!-- الفرع -->
        <div class="form-group">

            <label>
                <i class="fas fa-store"></i>
                اختر الفرع
            </label>

            <select id="branch" required>

                <option value="">
                    -- اختر الفرع --
                </option>

                <option
                    value="أكتوبر"
                    data-phone="201061119615"
                >
                    فرع أكتوبر
                </option>

                <option
                    value="فيصل"
                    data-phone="201032444727"
                >
                    فرع فيصل
                </option>

            </select>

            <div
                id="branchPhoneDisplay"
                class="branch-phone-display"
                style="display:none;"
            >

                <i class="fas fa-phone"></i>

                <span>
                    رقم الفرع:
                    <span id="phoneNumberDisplay"></span>
                </span>

            </div>

        </div>


        <!-- اليوم -->
        <div class="form-group">

            <label>
                <i class="fas fa-calendar-day"></i>
                يوم العمل بالعيادة
            </label>

            <select
                id="day"
                required
                disabled
            >
                <option value="">
                    -- اختر الفرع أولاً --
                </option>
            </select>

        </div>


        <!-- تاريخ الحجز -->
        <div class="form-group">

            <label>
                <i class="fas fa-calendar-alt"></i>
                تاريخ الحجز
            </label>

            <select
                id="bookingDate"
                required
                disabled
            >
                <option value="">
                    -- اختر يوم العمل أولاً --
                </option>
            </select>

            <div
                id="dateLoading"
                class="loading-msg"
            >
                <i class="fas fa-spinner fa-spin"></i>
                جاري فحص المواعيد المتاحة...
            </div>

        </div>


        <!-- الوقت -->
        <div class="form-group">

            <label>
                <i class="fas fa-clock"></i>
                الوقت
            </label>

            <select
                id="time"
                required
                disabled
            >
                <option value="">
                    -- اختر تاريخ الحجز أولاً --
                </option>
            </select>

            <div
                id="fullDayMessage"
                class="full-day-msg"
            >
                <i class="fas fa-calendar-xmark"></i>
                عذرًا، هذا اليوم مكتمل الحجز ولا توجد مواعيد متاحة.
            </div>

            <div
                id="emptyDayMessage"
                class="empty-day-msg"
            >
                <i class="fas fa-calendar-minus"></i>
                لا توجد مواعيد متاحة لهذا اليوم.
            </div>

        </div>


        <!-- الاسم -->
        <div class="form-group">

            <label>
                <i class="fas fa-user"></i>
                الاسم الكامل
            </label>

            <input
                type="text"
                id="name"
                placeholder="أدخل اسمك ثلاثي"
                required
            >

        </div>


        <!-- السن -->
        <div class="form-group">

            <label>
                <i class="fas fa-birthday-cake"></i>
                السن
            </label>

            <input
                type="number"
                id="age"
                placeholder="أدخل السن (بالسنوات)"
                min="0"
                max="120"
                required
            >

        </div>


        <!-- الهاتف -->
        <div class="form-group">

            <label>
                <i class="fas fa-phone"></i>
                رقم التليفون (واتساب)
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="مثال: 01012345678"
                required
            >

        </div>


        <!-- الملاحظات -->
        <div class="form-group">

            <label>
                <i class="fas fa-pen"></i>
                ملاحظات (اختياري)
            </label>

            <textarea
                id="notes"
                placeholder="أي تفاصيل إضافية تريد إخبارنا بها"
            ></textarea>

        </div>


        <!-- زر الحجز -->
        <button
            type="submit"
            class="btn-submit"
            id="submitButton"
        >

            <i class="fab fa-whatsapp"></i>

            تأكيد الحجز

        </button>

    </form>


    <div class="back-link">

        <a href="index.html">

            <i class="fas fa-arrow-right"></i>

            العودة إلى الصفحة الرئيسية

        </a>

    </div>

</div>


<script>

    /*
     * ============================================================
     * رابط Google Apps Script
     * ============================================================
     */

    const SITE_API_URL =
        'https://script.google.com/macros/s/AKfycbyzGUHN905ITGjsrKA6_CWJR23Xq3ste9bYW3iiY1LmtA3eU1kBSdgPK_tFuQb9DhU/exec';


    /*
     * ============================================================
     * المتغيرات
     * ============================================================
     */

    let branchDays = {};

    let branchTimes = {};

    // المواعيد المحجوزة حاليًا
    let currentBookedSlots = [];

    // المواعيد المتاحة حاليًا
    let currentAvailableSlots = [];


    /*
     * ============================================================
     * جلب مواعيد العمل من Google Sheet
     * ============================================================
     */

    async function loadWorkingHours() {

        try {

            const response = await fetch(
                SITE_API_URL + '?action=getSchedule'
            );

            const result = await response.json();


            if (
                result &&
                result.status === "OK" &&
                result.data &&
                result.data.length > 0
            ) {

                const dayOrder = [
                    'السبت',
                    'الأحد',
                    'الإثنين',
                    'الثلاثاء',
                    'الأربعاء',
                    'الخميس',
                    'الجمعة'
                ];


                branchDays = {};

                branchTimes = {};


                result.data.forEach(item => {

                    const branch = item.branch;

                    const day = item.day;

                    const time = item.time;


                    if (!branchDays[branch]) {
                        branchDays[branch] = [];
                    }


                    if (!branchDays[branch].includes(day)) {

                        branchDays[branch].push(day);

                    }


                    if (!branchTimes[branch]) {

                        branchTimes[branch] = {};

                    }


                    branchTimes[branch][day] = time;

                });


                for (let branch in branchDays) {

                    branchDays[branch].sort(
                        (a, b) =>
                            dayOrder.indexOf(a) -
                            dayOrder.indexOf(b)
                    );

                }

            } else {

                setupDefaultData();

            }


            document.getElementById('branch').disabled = false;


        } catch (error) {

            console.error(
                'خطأ في جلب مواعيد العمل:',
                error
            );

            setupDefaultData();

            document.getElementById('branch').disabled = false;

        }

    }


    /*
     * ============================================================
     * البيانات الافتراضية
     * ============================================================
     */

    function setupDefaultData() {

        branchDays = {

            "أكتوبر": [
                "السبت",
                "الإثنين",
                "الثلاثاء",
                "الخميس"
            ],

            "فيصل": [
                "السبت",
                "الإثنين",
                "الثلاثاء",
                "الخميس"
            ]

        };


        branchTimes = {

            "أكتوبر": {

                "السبت": "6:00 م - 8:30 م",

                "الإثنين": "6:00 م - 8:30 م",

                "الثلاثاء": "7:00 م - 9:00 م",

                "الخميس": "6:00 م - 8:30 م"

            },


            "فيصل": {

                "السبت": "6:00 م - 8:30 م",

                "الإثنين": "6:00 م - 8:30 م",

                "الثلاثاء": "7:00 م - 9:00 م",

                "الخميس": "6:00 م - 8:30 م"

            }

        };

    }


    /*
     * ============================================================
     * تحويل الوقت إلى دقائق
     * ============================================================
     */

    function timeStrToMinutes(raw) {

        const s = String(raw).trim();

        const isPM =
            s.includes('م') &&
            !s.includes('ص');

        const isAM =
            s.includes('ص');


        const numsPart =
            s
                .replace(/[صم]/g, '')
                .trim();


        let [h, m] =
            numsPart
                .split(':')
                .map(v => parseInt(v, 10));


        if (isNaN(m)) {
            m = 0;
        }


        if (isNaN(h)) {
            return null;
        }


        if (isPM && h !== 12) {
            h += 12;
        }


        if (isAM && h === 12) {
            h = 0;
        }


        return h * 60 + m;

    }


    /*
     * ============================================================
     * تحويل الدقائق إلى وقت عربي
     * ============================================================
     */

    function minutesToTimeStr(totalMinutes) {

        let h =
            Math.floor(totalMinutes / 60) % 24;

        const m =
            totalMinutes % 60;


        const period =
            h >= 12 ? 'م' : 'ص';


        let h12 =
            h % 12;


        if (h12 === 0) {
            h12 = 12;
        }


        const mm =
            String(m).padStart(2, '0');


        return `${h12}:${mm} ${period}`;

    }


    /*
     * ============================================================
     * إنشاء مواعيد كل 20 دقيقة
     * ============================================================
     */

    function generateTimeSlots(rangeStr, stepMinutes) {

        if (!rangeStr) {
            return [];
        }


        const parts =
            String(rangeStr)
                .split(/-|–|إلى/)
                .map(p => p.trim())
                .filter(Boolean);


        if (parts.length < 2) {
            return [rangeStr];
        }


        const startMin =
            timeStrToMinutes(parts[0]);


        const endMin =
            timeStrToMinutes(parts[1]);


        if (
            startMin === null ||
            endMin === null
        ) {

            return [rangeStr];

        }


        const slots = [];


        for (
            let t = startMin;
            t < endMin;
            t += stepMinutes
        ) {

            slots.push(
                minutesToTimeStr(t)
            );

        }


        return slots;

    }


    /*
     * ============================================================
     * ترتيب الأيام
     * ============================================================
     */

    function getDayIndex(dayName) {

        const map = {

            'الأحد': 0,
            'الإثنين': 1,
            'الثلاثاء': 2,
            'الأربعاء': 3,
            'الخميس': 4,
            'الجمعة': 5,
            'السبت': 6

        };


        return map[dayName];

    }


    /*
     * ============================================================
     * تحويل التاريخ إلى YYYY-MM-DD
     * ============================================================
     */

    function localDateToISO(date) {

        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, '0');


        const day =
            String(
                date.getDate()
            ).padStart(2, '0');


        return `${year}-${month}-${day}`;

    }


    /*
     * ============================================================
     * إنشاء التواريخ القادمة
     * ============================================================
     */

    function generateUpcomingDates(dayName) {

        const dates = [];


        const targetDayIndex =
            getDayIndex(dayName);


        const currentDate =
            new Date();


        currentDate.setHours(
            0,
            0,
            0,
            0
        );


        for (
            let i = 0;
            i < 60;
            i++
        ) {

            if (
                currentDate.getDay() ===
                targetDayIndex
            ) {

                const formatted =
                    localDateToISO(currentDate);


                const displayFormatted =
                    `${dayName} (${formatted})`;


                dates.push({

                    value: displayFormatted,

                    text: displayFormatted

                });

            }


            currentDate.setDate(
                currentDate.getDate() + 1
            );

        }


        return dates;

    }


    /*
     * ============================================================
     * استخراج YYYY-MM-DD من اختيار التاريخ
     * ============================================================
     */

    function extractDateOnly(value) {

        const match =
            String(value || '')
                .match(/\d{4}-\d{2}-\d{2}/);


        return match
            ? match[0]
            : '';

    }


    /*
     * ============================================================
     * إظهار/إخفاء رسائل حالة اليوم
     * ============================================================
     */

    function resetAvailabilityMessages() {

        document.getElementById(
            'fullDayMessage'
        ).style.display = 'none';


        document.getElementById(
            'emptyDayMessage'
        ).style.display = 'none';


        document.getElementById(
            'dateLoading'
        ).style.display = 'none';

    }


    /*
     * ============================================================
     * جلب المواعيد المحجوزة من Google Sheet
     * ============================================================
     */

    async function getBookedSlotsFromServer(
        branch,
        date
    ) {

        try {

            const url =
                SITE_API_URL +
                '?action=getBookedSlots' +
                '&branch=' +
                encodeURIComponent(branch) +
                '&date=' +
                encodeURIComponent(date);


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    'فشل الاتصال بالخادم'
                );

            }


            const result =
                await response.json();


            if (
                result &&
                Array.isArray(result.times)
            ) {

                return result.times
                    .map(t =>
                        String(t).trim()
                    );

            }


            return [];


        } catch (error) {

            console.error(
                'خطأ في جلب المواعيد المحجوزة:',
                error
            );

            throw error;

        }

    }


    /*
     * ============================================================
     * فلترة المواعيد المحجوزة
     * ============================================================
     */

    function filterAvailableSlots(
        allSlots,
        bookedSlots
    ) {

        const bookedSet =
            new Set(
                bookedSlots.map(
                    normalizeTimeString
                )
            );


        return allSlots.filter(slot => {

            const normalized =
                normalizeTimeString(slot);

            return !bookedSet.has(normalized);

        });

    }


    /*
     * ============================================================
     * توحيد شكل الوقت للمقارنة
     * ============================================================
     */

    function normalizeTimeString(value) {

        return String(value || '')
            .replace(/\s+/g, ' ')
            .trim();

    }


    /*
     * ============================================================
     * عند اختيار الفرع
     * ============================================================
     */

    document
        .getElementById('branch')
        .addEventListener(
            'change',
            function () {

                const branch =
                    this.value;


                const daySelect =
                    document.getElementById(
                        'day'
                    );


                const dateSelect =
                    document.getElementById(
                        'bookingDate'
                    );


                const timeSelect =
                    document.getElementById(
                        'time'
                    );


                const phoneDisplay =
                    document.getElementById(
                        'branchPhoneDisplay'
                    );


                const phoneSpan =
                    document.getElementById(
                        'phoneNumberDisplay'
                    );


                const selected =
                    this.options[
                        this.selectedIndex
                    ];


                const phone =
                    selected.getAttribute(
                        'data-phone'
                    );


                if (phone) {

                    phoneSpan.textContent =
                        phone;


                    phoneDisplay.style.display =
                        'flex';

                } else {

                    phoneDisplay.style.display =
                        'none';

                }


                daySelect.innerHTML =
                    '<option value="">-- اختر اليوم --</option>';

                daySelect.disabled =
                    true;


                dateSelect.innerHTML =
                    '<option value="">-- اختر يوم العمل أولاً --</option>';

                dateSelect.disabled =
                    true;


                timeSelect.innerHTML =
                    '<option value="">-- اختر تاريخ الحجز أولاً --</option>';

                timeSelect.disabled =
                    true;


                currentBookedSlots = [];

                currentAvailableSlots = [];


                resetAvailabilityMessages();


                if (
                    !branch ||
                    !branchDays[branch]
                ) {

                    return;

                }


                const days =
                    branchDays[branch];


                if (days.length === 0) {

                    return;

                }


                daySelect.disabled =
                    false;


                daySelect.innerHTML =
                    '<option value="">-- اختر اليوم --</option>';


                days.forEach(day => {

                    const option =
                        document.createElement(
                            'option'
                        );


                    option.value =
                        day;


                    option.textContent =
                        day;


                    daySelect.appendChild(
                        option
                    );

                });

            }
        );


    /*
     * ============================================================
     * عند اختيار اليوم
     * ============================================================
     */

    document
        .getElementById('day')
        .addEventListener(
            'change',
            function () {

                const day =
                    this.value;


                const dateSelect =
                    document.getElementById(
                        'bookingDate'
                    );


                const timeSelect =
                    document.getElementById(
                        'time'
                    );


                dateSelect.innerHTML =
                    '<option value="">-- اختر تاريخ الحجز --</option>';

                dateSelect.disabled =
                    true;


                timeSelect.innerHTML =
                    '<option value="">-- اختر تاريخ الحجز أولاً --</option>';

                timeSelect.disabled =
                    true;


                currentBookedSlots = [];

                currentAvailableSlots = [];


                resetAvailabilityMessages();


                if (!day) {
                    return;
                }


                const upcomingDates =
                    generateUpcomingDates(day);


                if (
                    upcomingDates.length === 0
                ) {

                    return;

                }


                dateSelect.disabled =
                    false;


                upcomingDates.forEach(d => {

                    const option =
                        document.createElement(
                            'option'
                        );


                    option.value =
                        d.value;


                    option.textContent =
                        d.text;


                    dateSelect.appendChild(
                        option
                    );

                });

            }
        );


    /*
     * ============================================================
     * عند اختيار التاريخ
     * ============================================================
     */

    document
        .getElementById('bookingDate')
        .addEventListener(
            'change',
            async function () {

                const branch =
                    document.getElementById(
                        'branch'
                    ).value;


                const day =
                    document.getElementById(
                        'day'
                    ).value;


                const selectedDate =
                    this.value;


                const timeSelect =
                    document.getElementById(
                        'time'
                    );


                const loading =
                    document.getElementById(
                        'dateLoading'
                    );


                const fullDay =
                    document.getElementById(
                        'fullDayMessage'
                    );


                const emptyDay =
                    document.getElementById(
                        'emptyDayMessage'
                    );


                timeSelect.innerHTML =
                    '<option value="">-- جاري فحص المواعيد --</option>';

                timeSelect.disabled =
                    true;


                fullDay.style.display =
                    'none';


                emptyDay.style.display =
                    'none';


                currentBookedSlots = [];

                currentAvailableSlots = [];


                if (
                    !branch ||
                    !day ||
                    !selectedDate
                ) {

                    return;

                }


                const dateOnly =
                    extractDateOnly(
                        selectedDate
                    );


                if (!dateOnly) {

                    emptyDay.style.display =
                        'block';

                    emptyDay.innerHTML =
                        '<i class="fas fa-calendar-minus"></i> تعذر قراءة تاريخ الحجز.';

                    return;

                }


                const rangeStr =
                    branchTimes?.[branch]?.[day];


                if (!rangeStr) {

                    emptyDay.style.display =
                        'block';

                    emptyDay.innerHTML =
                        '<i class="fas fa-calendar-minus"></i> لا توجد مواعيد عمل مسجلة لهذا اليوم.';

                    return;

                }


                /*
                 * إنشاء كل المواعيد كل 20 دقيقة
                 */

                const allSlots =
                    generateTimeSlots(
                        rangeStr,
                        20
                    );


                if (
                    allSlots.length === 0
                ) {

                    emptyDay.style.display =
                        'block';

                    emptyDay.innerHTML =
                        '<i class="fas fa-calendar-minus"></i> لا توجد مواعيد متاحة لهذا اليوم.';

                    return;

                }


                /*
                 * إظهار التحميل
                 */

                loading.style.display =
                    'block';


                try {

                    /*
                     * جلب المواعيد المحجوزة
                     */

                    const bookedSlots =
                        await getBookedSlotsFromServer(
                            branch,
                            dateOnly
                        );


                    currentBookedSlots =
                        bookedSlots;


                    /*
                     * إزالة المواعيد المحجوزة
                     */

                    const availableSlots =
                        filterAvailableSlots(
                            allSlots,
                            bookedSlots
                        );


                    currentAvailableSlots =
                        availableSlots;


                    loading.style.display =
                        'none';


                    /*
                     * لو كل المواعيد محجوزة
                     */

                    if (
                        availableSlots.length === 0
                    ) {

                        timeSelect.innerHTML =
                            '<option value="">-- اليوم مكتمل الحجز --</option>';

                        timeSelect.disabled =
                            true;


                        fullDay.style.display =
                            'block';


                        return;

                    }


                    /*
                     * يوجد مواعيد متاحة
                     */

                    timeSelect.innerHTML =
                        '<option value="">-- اختر الميعاد --</option>';


                    availableSlots.forEach(slot => {

                        const option =
                            document.createElement(
                                'option'
                            );


                        option.value =
                            slot;


                        option.textContent =
                            slot;


                        timeSelect.appendChild(
                            option
                        );

                    });


                    timeSelect.disabled =
                        false;


                } catch (error) {

                    loading.style.display =
                        'none';


                    timeSelect.innerHTML =
                        '<option value="">-- تعذر تحميل المواعيد --</option>';


                    timeSelect.disabled =
                        true;


                    emptyDay.style.display =
                        'block';


                    emptyDay.innerHTML =
                        '<i class="fas fa-triangle-exclamation"></i> تعذر الاتصال بنظام الحجز. حاول مرة أخرى.';


                    console.error(error);

                }

            }
        );


    /*
     * ============================================================
     * التأكد مرة ثانية أن الموعد ما زال متاحًا
     * ============================================================
     */

    async function isSlotStillAvailable(
        branch,
        date,
        time
    ) {

        const bookedSlots =
            await getBookedSlotsFromServer(
                branch,
                date
            );


        const bookedSet =
            new Set(
                bookedSlots.map(
                    normalizeTimeString
                )
            );


        return !bookedSet.has(
            normalizeTimeString(time)
        );

    }


    /*
     * ============================================================
     * إرسال الحجز
     * ============================================================
     */

    async function submitBooking(e) {

        e.preventDefault();


        const submitButton =
            document.getElementById(
                'submitButton'
            );


        const branch =
            document.getElementById(
                'branch'
            );


        const branchName =
            branch.value;


        const branchPhone =
            branch
                .options[
                    branch.selectedIndex
                ]
                .getAttribute(
                    'data-phone'
                );


        const bookingDate =
            document.getElementById(
                'bookingDate'
            ).value;


        const timeStr =
            document.getElementById(
                'time'
            ).value;


        const name =
            document.getElementById(
                'name'
            ).value.trim();


        const age =
            document.getElementById(
                'age'
            ).value.trim();


        const phone =
            document.getElementById(
                'phone'
            ).value.trim();


        const notes =
            document.getElementById(
                'notes'
            ).value.trim();


        /*
         * التحقق من البيانات
         */

        if (
            !branchName ||
            !bookingDate ||
            !timeStr ||
            !name ||
            !age ||
            !phone
        ) {

            alert(
                'يرجى ملء جميع الحقول المطلوبة بما في ذلك السن.'
            );

            return;

        }


        /*
         * استخراج التاريخ فقط
         */

        const dateOnly =
            extractDateOnly(
                bookingDate
            );


        if (!dateOnly) {

            alert(
                'تعذر قراءة تاريخ الحجز.'
            );

            return;

        }


        /*
         * منع الضغط أكثر من مرة
         */

        submitButton.disabled =
            true;


        submitButton.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> جاري التحقق من الموعد...';


        try {

            /*
             * ====================================================
             * أهم خطوة:
             * إعادة فحص الموعد قبل تسجيل الحجز
             * ====================================================
             */

            const stillAvailable =
                await isSlotStillAvailable(
                    branchName,
                    dateOnly,
                    timeStr
                );


            if (!stillAvailable) {

                alert(
                    '⚠️ عذرًا، هذا الموعد تم حجزه للتو من شخص آخر. يرجى اختيار موعد آخر.'
                );


                /*
                 * إعادة تحميل المواعيد
                 */

                document
                    .getElementById(
                        'bookingDate'
                    )
                    .dispatchEvent(
                        new Event('change')
                    );


                submitButton.disabled =
                    false;


                submitButton.innerHTML =
                    '<i class="fab fa-whatsapp"></i> تأكيد الحجز';


                return;

            }


            /*
             * ====================================================
             * بيانات الحجز
             * ====================================================
             */

            const bookingData = {

                branch: branchName,

                date: bookingDate,

                time: timeStr,

                name: name,

                age: age,

                phone: phone,

                notes: notes

            };


            /*
             * ====================================================
             * إرسال الحجز إلى Google Sheet
             * ====================================================
             */

            submitButton.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل الحجز...';


            await fetch(
                SITE_API_URL,
                {

                    method: 'POST',

                    mode: 'no-cors',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify(
                            bookingData
                        )

                }
            );


            /*
             * ====================================================
             * إنشاء رسالة واتساب
             * ====================================================
             */

            let message =
                `مرحباً، أريد تسجيل حجز موعد في فرع ${branchName}:\n`;


            message +=
                `📅 التاريخ: ${bookingDate}\n`;


            message +=
                `⏰ الوقت: ${timeStr}\n`;


            message +=
                `👤 الاسم: ${name}\n`;


            message +=
                `🎂 السن: ${age} سنة\n`;


            message +=
                `📞 رقم الهاتف: ${phone}\n`;


            if (notes) {

                message +=
                    `📝 ملاحظات: ${notes}\n`;

            }


            message +=
                `\nأرجو تأكيد الحجز برقم الحجز الخاص بي، شكراً!`;


            /*
             * ====================================================
             * فتح واتساب
             * ====================================================
             */

            const encodedMessage =
                encodeURIComponent(
                    message
                );


            const whatsappUrl =
                `https://wa.me/${branchPhone}?text=${encodedMessage}`;


            window.open(
                whatsappUrl,
                '_blank'
            );


            /*
             * ====================================================
             * رسالة نجاح
             * ====================================================
             */

            alert(
                '✅ تم تسجيل الحجز بنجاح وتحويلك إلى واتساب لتأكيد الموعد.'
            );


            /*
             * ====================================================
             * إعادة ضبط النموذج
             * ====================================================
             */

            document
                .getElementById(
                    'bookingForm'
                )
                .reset();


            document
                .getElementById(
                    'day'
                )
                .disabled = true;


            document
                .getElementById(
                    'bookingDate'
                )
                .disabled = true;


            document
                .getElementById(
                    'time'
                )
                .disabled = true;


            document
                .getElementById(
                    'branchPhoneDisplay'
                )
                .style.display = 'none';


            currentBookedSlots = [];

            currentAvailableSlots = [];


            resetAvailabilityMessages();


        } catch (error) {

            console.error(
                'خطأ أثناء تسجيل الحجز:',
                error
            );


            alert(
                'حدث خطأ أثناء تسجيل الحجز. يرجى المحاولة مرة أخرى.'
            );

        }


        /*
         * إعادة الزر لحالته الطبيعية
         */

        submitButton.disabled =
            false;


        submitButton.innerHTML =
            '<i class="fab fa-whatsapp"></i> تأكيد الحجز';

    }


    /*
     * ============================================================
     * عداد الزوار
     * ============================================================
     */

    (function () {

        function updateCounter(data) {

            var el =
                document.getElementById(
                    'siteVisitorCounter'
                );


            if (el) {

                el.textContent =
                    data.count.toLocaleString(
                        'ar-EG'
                    ) +
                    ' زائر';

            }

        }


        window.__visitorCounterCallback =
            updateCounter;


        var pageId =
            window.location.pathname
                .replace(/\//g, '_') ||
            'home';


        var s =
            document.createElement(
                'script'
            );


        s.src =
            SITE_API_URL +
            '?action=trackVisit&page=' +
            encodeURIComponent(pageId) +
            '&callback=__visitorCounterCallback';


        document.body.appendChild(s);

    })();


    /*
     * ============================================================
     * تشغيل الصفحة
     * ============================================================
     */

    window.onload = function () {

        document
            .getElementById(
                'branch'
            )
            .disabled = true;


        loadWorkingHours();

    };

</script>
