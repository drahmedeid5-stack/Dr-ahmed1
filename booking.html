<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حجز موعد - عيادة دكتور أحمد عبد الرفاعي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f6f8;
            color: #1e2a3a;
            line-height: 1.8;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .booking-card {
            background: #ffffff;
            max-width: 650px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            border: 1px solid rgba(201, 154, 43, 0.15);
        }
        .booking-card h1 {
            font-size: 2rem;
            font-weight: 900;
            color: #1a3a60;
            text-align: center;
            margin-bottom: 6px;
        }
        .booking-card h1 i {
            color: #c99a2b;
            margin-left: 10px;
        }
        .booking-card .sub {
            text-align: center;
            color: #5a6a7a;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            color: #1a3a60;
            margin-bottom: 6px;
            font-size: 1rem;
        }
        .form-group label i {
            color: #c99a2b;
            margin-left: 8px;
            width: 20px;
        }
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e4e8;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            background: #f5f6f8;
            transition: 0.3s ease;
        }
        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #c99a2b;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(201, 154, 43, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .form-row .form-group {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
        }
        .branch-phone-display {
            background: #f5f6f8;
            padding: 10px 16px;
            border-radius: 12px;
            margin-top: 6px;
            font-weight: 600;
            color: #1a3a60;
            display: flex;
            align-items: center;
            gap: 12px;
            border-right: 4px solid #c99a2b;
        }
        .branch-phone-display i {
            color: #25d366;
            font-size: 1.2rem;
        }
        .btn-submit {
            display: block;
            width: 100%;
            background: #c99a2b;
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(201, 154, 43, 0.35);
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #b0861f;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(201, 154, 43, 0.5);
        }
        .btn-submit i {
            margin-left: 12px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #5a6a7a;
            font-weight: 600;
            transition: 0.3s ease;
        }
        .back-link a {
            color: #2a4a7a;
            text-decoration: none;
        }
        .back-link a:hover {
            color: #c99a2b;
        }
        .note-msg {
            background: #fff9e6;
            padding: 12px 18px;
            border-radius: 12px;
            border-right: 4px solid #c99a2b;
            font-size: 0.9rem;
            color: #5a6a7a;
            margin-bottom: 20px;
        }
        .note-msg i {
            color: #c99a2b;
            margin-left: 8px;
        }
        /* رسالة خطأ أو تحذير */
        .error-msg {
            color: #d32f2f;
            font-size: 0.9rem;
            margin-top: 6px;
            display: none;
        }
        @media (max-width: 550px) {
            .booking-card {
                padding: 24px 18px;
            }
            .form-row .form-group {
                flex: 1 1 100%;
            }
            .booking-card h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="booking-card">
        <h1><i class="fas fa-calendar-check"></i> حجز موعد</h1>
        <p class="sub">اختر الفرع والموعد المناسب لك</p>
        <div class="note-msg">
            <i class="fas fa-info-circle"></i>
            سيتم إرسال بيانات حجزك عبر واتساب لتأكيد الموعد. كما سيتم تسجيل الحجز في قاعدة البيانات.
        </div>
        <form id="bookingForm" onsubmit="submitBooking(event)">
            <!-- اختيار الفرع -->
            <div class="form-group">
                <label><i class="fas fa-store"></i> اختر الفرع</label>
                <select id="branch" required>
                    <option value="">-- اختر --</option>
                    <option value="أكتوبر" data-phone="201061119615">فرع أكتوبر</option>
                    <option value="فيصل" data-phone="201032444727">فرع فيصل</option>
                </select>
                <div id="branchPhoneDisplay" class="branch-phone-display" style="display:none;">
                    <i class="fas fa-phone"></i>
                    <span>رقم الفرع: <span id="phoneNumberDisplay"></span></span>
                </div>
            </div>

            <!-- اليوم (يتغير بناءً على الفرع) -->
            <div class="form-group" id="dayGroup">
                <label><i class="fas fa-calendar-day"></i> اليوم</label>
                <select id="day" required disabled>
                    <option value="">-- اختر الفرع أولاً --</option>
                </select>
            </div>

            <!-- الوقت (يتغير بناءً على اليوم) -->
            <div class="form-group" id="timeGroup">
                <label><i class="fas fa-clock"></i> الوقت</label>
                <select id="time" required disabled>
                    <option value="">-- اختر اليوم أولاً --</option>
                </select>
            </div>

            <!-- باقي الحقول -->
            <div class="form-group">
                <label><i class="fas fa-user"></i> الاسم الكامل</label>
                <input type="text" id="name" placeholder="أدخل اسمك" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> رقم التليفون</label>
                <input type="tel" id="phone" placeholder="مثال: 01012345678" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-pen"></i> ملاحظات (اختياري)</label>
                <textarea id="notes" placeholder="أي تفاصيل إضافية تريد إخبارنا بها"></textarea>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fab fa-whatsapp"></i> تأكيد الحجز عبر واتساب
            </button>
        </form>
        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-right"></i> العودة إلى الصفحة الرئيسية</a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ربط API لجلب بيانات الموقع (بما فيها مواعيد العمل)
        // ============================================================
        // ⚠️ استبدل هذا الرابط بالرابط الخاص بـ Web App بتاع شيت إدارة الموقع
        const SITE_API_URL = 'https://script.google.com/macros/s/AKfycbzUHh_JfDAR6P9KxKxS9yNTuFPu7eRDarHV5ojwNwI7dPUj3hOFNsm7PZZwz0ywu1RITQ/exec';

        // ============================================================
        // 2. متغيرات لتخزين البيانات
        // ============================================================
        let workingHoursData = []; // هتخزن كل صفوف التاب "مواعيد_العمل"
        let branchDays = {};      // هتخزن الأيام لكل فرع
        let branchTimes = {};     // هتخزن الأوقات لكل فرع ويوم

        // ============================================================
        // 3. جلب بيانات مواعيد العمل من التاب "مواعيد_العمل"
        // ============================================================
        async function loadWorkingHours() {
            try {
                const response = await fetch(SITE_API_URL);
                const data = await response.json();

                // نفترض إن الـ API بيرجع مصفوفة من الصفوف
                // أو كائن فيه مفتاح "working_hours" يحتوي على المصفوفة
                // هنا هنفترض إن البيانات جاية في صورة مصفوفة من الكائنات
                // { branch, day, from, to, status }
                // هنضبطها حسب شكل البيانات اللي هترجعها من الـ Sheet
                // لكن للتبسيط، هنحاكي البيانات كمثال، وبعدين نستبدلها بالبيانات الحقيقية

                // هنفترض إن الـ API بيرجع JSON بالشكل ده:
                // { "status": "OK", "data": [ { "branch": "أكتوبر", "day": "السبت", "from": "09:00", "to": "14:00", "status": "مفتوح" }, ... ] }

                // هنا هنعالج البيانات ونخزنها في المتغيرات
                if (data && data.data) {
                    workingHoursData = data.data;
                } else {
                    // لو البيانات مش بالشكل المتوقع، نستخدم بيانات افتراضية للتجربة
                    console.warn('البيانات مش بالشكل المتوقع، بنستخدم بيانات افتراضية.');
                    workingHoursData = getDefaultWorkingHours();
                }

                // تنظيم البيانات في كائنات لتسهيل الوصول
                organizeWorkingHours();

                // تفعيل قائمة الفرع (بعد ما البيانات تتحمل)
                document.getElementById('branch').disabled = false;

            } catch (error) {
                console.error('خطأ في جلب مواعيد العمل:', error);
                // في حالة الخطأ، نستخدم بيانات افتراضية
                workingHoursData = getDefaultWorkingHours();
                organizeWorkingHours();
                document.getElementById('branch').disabled = false;
                alert('حدث خطأ في تحميل مواعيد العمل، سيتم استخدام المواعيد الافتراضية.');
            }
        }

        // بيانات افتراضية (للتجربة)
        function getDefaultWorkingHours() {
            return [
                { branch: 'أكتوبر', day: 'السبت', from: '09:00', to: '14:00', status: 'مفتوح' },
                { branch: 'أكتوبر', day: 'الأحد', from: 'مغلق', to: 'مغلق', status: 'مغلق' },
                { branch: 'أكتوبر', day: 'الإثنين', from: '17:00', to: '21:00', status: 'مفتوح' },
                { branch: 'أكتوبر', day: 'الثلاثاء', from: '09:00', to: '14:00', status: 'مفتوح' },
                { branch: 'أكتوبر', day: 'الأربعاء', from: 'مغلق', to: 'مغلق', status: 'مغلق' },
                { branch: 'أكتوبر', day: 'الخميس', from: '09:00', to: '14:00', status: 'مفتوح' },
                { branch: 'أكتوبر', day: 'الجمعة', from: 'مغلق', to: 'مغلق', status: 'مغلق' },
                { branch: 'فيصل', day: 'السبت', from: '10:00', to: '15:00', status: 'مفتوح' },
                { branch: 'فيصل', day: 'الأحد', from: 'مغلق', to: 'مغلق', status: 'مغلق' },
                { branch: 'فيصل', day: 'الإثنين', from: '08:00', to: '12:00', status: 'مفتوح' },
                { branch: 'فيصل', day: 'الثلاثاء', from: '16:00', to: '20:00', status: 'مفتوح' },
                { branch: 'فيصل', day: 'الأربعاء', from: 'مغلق', to: 'مغلق', status: 'مغلق' },
                { branch: 'فيصل', day: 'الخميس', from: '10:00', to: '15:00', status: 'مفتوح' },
                { branch: 'فيصل', day: 'الجمعة', from: 'مغلق', to: 'مغلق', status: 'مغلق' }
            ];
        }

        // ============================================================
        // 4. تنظيم البيانات في كائنات
        // ============================================================
        function organizeWorkingHours() {
            branchDays = {};
            branchTimes = {};

            workingHoursData.forEach(item => {
                const branch = item.branch;
                const day = item.day;
                const from = item.from;
                const to = item.to;
                const status = item.status;

                // إذا كان اليوم مفتوح، نضيفه للأيام المتاحة
                if (status === 'مفتوح' || status === 'open' || status === 'available') {
                    if (!branchDays[branch]) {
                        branchDays[branch] = [];
                    }
                    if (!branchDays[branch].includes(day)) {
                        branchDays[branch].push(day);
                    }

                    // تخزين الأوقات لهذا اليوم
                    if (!branchTimes[branch]) {
                        branchTimes[branch] = {};
                    }
                    if (!branchTimes[branch][day]) {
                        branchTimes[branch][day] = [];
                    }
                    // إضافة الوقت (من - إلى) ككائن
                    branchTimes[branch][day].push({ from: from, to: to });
                }
            });

            // ترتيب الأيام حسب ترتيب الأسبوع
            const dayOrder = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
            for (let branch in branchDays) {
                branchDays[branch].sort((a, b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));
            }
        }

        // ============================================================
        // 5. تحديث قائمة الأيام عند اختيار الفرع
        // ============================================================
        document.getElementById('branch').addEventListener('change', function() {
            const branch = this.value;
            const daySelect = document.getElementById('day');
            const timeSelect = document.getElementById('time');
            const phoneDisplay = document.getElementById('branchPhoneDisplay');
            const phoneSpan = document.getElementById('phoneNumberDisplay');

            // عرض رقم الفرع
            const selected = this.options[this.selectedIndex];
            const phone = selected.getAttribute('data-phone');
            if (phone) {
                phoneSpan.textContent = phone;
                phoneDisplay.style.display = 'flex';
            } else {
                phoneDisplay.style.display = 'none';
            }

            // إعادة تعيين قائمة الأيام
            daySelect.innerHTML = '';
            timeSelect.innerHTML = '<option value="">-- اختر اليوم أولاً --</option>';
            timeSelect.disabled = true;

            if (!branch || !branchDays[branch]) {
                daySelect.disabled = true;
                daySelect.innerHTML = '<option value="">-- لا توجد مواعيد متاحة --</option>';
                return;
            }

            // ملء قائمة الأيام المتاحة
            const days = branchDays[branch];
            if (days.length === 0) {
                daySelect.disabled = true;
                daySelect.innerHTML = '<option value="">-- لا توجد مواعيد متاحة --</option>';
                return;
            }

            daySelect.disabled = false;
            daySelect.innerHTML = '<option value="">-- اختر اليوم --</option>';
            days.forEach(day => {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day;
                daySelect.appendChild(option);
            });
        });

        // ============================================================
        // 6. تحديث قائمة الأوقات عند اختيار اليوم
        // ============================================================
        document.getElementById('day').addEventListener('change', function() {
            const branch = document.getElementById('branch').value;
            const day = this.value;
            const timeSelect = document.getElementById('time');

            timeSelect.innerHTML = '';
            timeSelect.disabled = true;

            if (!branch || !day || !branchTimes[branch] || !branchTimes[branch][day]) {
                timeSelect.innerHTML = '<option value="">-- لا توجد أوقات متاحة --</option>';
                return;
            }

            const times = branchTimes[branch][day];
            if (times.length === 0) {
                timeSelect.innerHTML = '<option value="">-- لا توجد أوقات متاحة --</option>';
                return;
            }

            timeSelect.disabled = false;
            timeSelect.innerHTML = '<option value="">-- اختر الوقت --</option>';
            times.forEach(timeSlot => {
                const option = document.createElement('option');
                // نعرض الوقت بالشكل: "من 09:00 إلى 14:00"
                option.value = `${timeSlot.from} - ${timeSlot.to}`;
                option.textContent = `من ${timeSlot.from} إلى ${timeSlot.to}`;
                timeSelect.appendChild(option);
            });
        });

        // ============================================================
        // 7. دالة إرسال الحجز (تعديل)
        // ============================================================
        // ⚠️ استبدل هذا الرابط بالرابط الخاص بـ Web App بتاع شيت الحجوزات
        const BOOKING_API_URL = 'https://script.google.com/macros/s/AKfycbzUHh_JfDAR6P9KxKxS9yNTuFPu7eRDarHV5ojwNwI7dPUj3hOFNsm7PZZwz0ywu1RITQ/exec';

        async function submitBooking(e) {
            e.preventDefault();

            const branch = document.getElementById('branch');
            const branchName = branch.value;
            const branchPhone = branch.options[branch.selectedIndex].getAttribute('data-phone');
            const day = document.getElementById('day').value;
            const timeRange = document.getElementById('time').value; // "09:00 - 14:00"
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!branchName || !day || !timeRange || !name || !phone) {
                alert('يرجى ملء جميع الحقول المطلوبة.');
                return;
            }

            // استخراج الوقت الفعلي من النطاق (نأخذ وقت البداية فقط)
            const timeParts = timeRange.split(' - ');
            const fromTime = timeParts[0] || '';

            // تنسيق التاريخ (نأخذ التاريخ الحالي أو نستخدم تاريخ ثابت)
            const now = new Date();
            const formattedDate = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            // نضيف اليوم والوقت المختار
            const fullDate = `${day} ${formattedDate}`;

            // ===== إرسال البيانات إلى Google Sheets (شيت الحجوزات) =====
            const bookingData = {
                branch: branchName,
                date: fullDate,
                time: fromTime,
                name: name,
                phone: phone,
                notes: notes
            };

            try {
                await fetch(BOOKING_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });
                console.log('✅ تم تسجيل الحجز في Google Sheets');
            } catch (error) {
                console.error('❌ خطأ في الإرسال إلى Google Sheets:', error);
            }

            // ===== فتح واتساب =====
            let message = `مرحباً، أريد حجز موعد في فرع ${branchName}:\n`;
            message += `📅 اليوم: ${day}\n`;
            message += `⏰ الوقت: ${timeRange}\n`;
            message += `👤 الاسم: ${name}\n`;
            message += `📞 رقم الهاتف: ${phone}\n`;
            if (notes) {
                message += `📝 ملاحظات: ${notes}\n`;
            }
            message += `\nشكراً!`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${branchPhone}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');

            alert('✅ تم تسجيل حجزك وإرسال رسالة إلى واتساب.');
        }

        // ============================================================
        // 8. تشغيل تحميل البيانات عند تحميل الصفحة
        // ============================================================
        window.onload = function() {
            // تعطيل حقول الفرع مؤقتاً حتى تتحمل البيانات
            document.getElementById('branch').disabled = true;
            loadWorkingHours();
        };
    </script>
</body>
</html>
