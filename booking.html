<style>

@media (max-width: 600px) {

<body>

<div class="booking-card">

    <h1>

    <p class="sub">

    <div class="note-msg">

    <form id="bookingForm" onsubmit="submitBooking(event)">

        <!-- الوقت -->

            <label>

        <!-- الاسم -->

        <!-- السن -->
        <div class="form-group">

        <!-- الهاتف -->

            <label>

        <!-- الملاحظات -->

    <div class="back-link">

        </a>

</div>


<script>

// ============================================================
// رابط Google Apps Script
// ============================================================

const SITE_API_URL =
'https://script.google.com/macros/s/AKfycbyzGUHN905ITGjsrKA6_CWJR23Xq3ste9bYW3iiY1LmtA3eU1kBSdgPK_tFuQb9DhU/exec';


// ============================================================
// بيانات المواعيد
// ============================================================

let branchDays = {};
let branchTimes = {};


// ============================================================
// تحميل مواعيد العمل
// ============================================================

async function loadWorkingHours() {

    try {

        const response =
            await fetch(
                SITE_API_URL + '?action=getSchedule'
            );

        const result =
            await response.json();


        if (
            result &&
            result.status === "OK" &&
            result.data &&
            result.data.length > 0
        ) {

            const dayOrder = [
                'السبت',
                'الأحد',
                'الإثنين',
                'الثلاثاء',
                'الأربعاء',
                'الخميس',
                'الجمعة'
            ];


            branchDays = {};
            branchTimes = {};


            result.data.forEach(item => {

                const branch = item.branch;
                const day = item.day;
                const time = item.time;


                if (!branchDays[branch]) {

                    branchDays[branch] = [];

                }


                if (
                    !branchDays[branch]
                        .includes(day)
                ) {

                    branchDays[branch].push(day);

                }


                if (!branchTimes[branch]) {

                    branchTimes[branch] = {};

                }


                branchTimes[branch][day] = time;

            });


            for (
                let branch in branchDays
            ) {

                branchDays[branch].sort(
                    (a, b) =>
                        dayOrder.indexOf(a) -
                        dayOrder.indexOf(b)
                );

            }

        }

        else {

            setupDefaultData();

        }


        document
            .getElementById('branch')
            .disabled = false;


    }

    catch (error) {

        console.error(
            'خطأ في جلب مواعيد العمل:',
            error
        );

        setupDefaultData();

        document
            .getElementById('branch')
            .disabled = false;

    }

}


// ============================================================
// بيانات افتراضية
// ============================================================

function setupDefaultData() {

    branchDays = {

        "أكتوبر": [
            "السبت",
            "الإثنين",
            "الثلاثاء",
            "الخميس"
        ],

        "فيصل": [
            "السبت",
            "الإثنين",
            "الثلاثاء",
            "الخميس"
        ]

    };


    branchTimes = {

        "أكتوبر": {

            "السبت":
                "6:00 م - 8:30 م",

            "الإثنين":
                "6:00 م - 8:30 م",

            "الثلاثاء":
                "7:00 م - 9:00 م",

            "الخميس":
                "6:00 م - 8:30 م"

        },


        "فيصل": {

            "السبت":
                "6:00 م - 8:30 م",

            "الإثنين":
                "6:00 م - 8:30 م",

            "الثلاثاء":
                "7:00 م - 9:00 م",

            "الخميس":
                "6:00 م - 8:30 م"

        }

    };

}


// ============================================================
// تحويل الوقت إلى دقائق
// ============================================================

function timeStrToMinutes(raw) {

    if (!raw) return null;

    const s = String(raw).trim();


    const isPM =
        s.includes('م') &&
        !s.includes('ص');


    const isAM =
        s.includes('ص');


    const numsPart =
        s.replace(/[صم]/g, '').trim();


    let [h, m] =
        numsPart
            .split(':')
            .map(v => parseInt(v, 10));


    if (isNaN(m)) {
        m = 0;
    }


    if (isNaN(h)) {
        return null;
    }


    if (isPM && h !== 12) {
        h += 12;
    }


    if (isAM && h === 12) {
        h = 0;
    }


    return h * 60 + m;

}


// ============================================================
// تحويل الدقائق إلى وقت عربي
// ============================================================

function minutesToTimeStr(totalMinutes) {

    let h =
        Math.floor(totalMinutes / 60) % 24;


    const m =
        totalMinutes % 60;


    const period =
        h >= 12 ? 'م' : 'ص';


    let h12 =
        h % 12;


    if (h12 === 0) {
        h12 = 12;
    }


    const mm =
        String(m).padStart(2, '0');


    return `${h12}:${mm} ${period}`;

}


// ============================================================
// إنشاء المواعيد كل 20 دقيقة
// ============================================================

function generateTimeSlots(
    rangeStr,
    stepMinutes = 20
) {

    if (!rangeStr) {
        return [];
    }


    const parts =
        String(rangeStr)
            .split(/-|–|إلى/)
            .map(p => p.trim())
            .filter(Boolean);


    if (parts.length < 2) {
        return [];
    }


    const startMin =
        timeStrToMinutes(parts[0]);


    const endMin =
        timeStrToMinutes(parts[1]);


    if (
        startMin === null ||
        endMin === null
    ) {

        return [];

    }


    const slots = [];


    // مهم:
    // الموعد كل 20 دقيقة
    // 6:00
    // 6:20
    // 6:40
    // 7:00
    // ...
    // 8:20
    //
    // لا نضيف 8:30 لأنها ليست على دورة الـ20 دقيقة.

    for (
        let t = startMin;
        t < endMin;
        t += stepMinutes
    ) {

        slots.push(
            minutesToTimeStr(t)
        );

    }


    return slots;

}


// ============================================================
// رقم اليوم
// ============================================================

function getDayIndex(dayName) {

    const map = {

        'الأحد': 0,
        'الإثنين': 1,
        'الثلاثاء': 2,
        'الأربعاء': 3,
        'الخميس': 4,
        'الجمعة': 5,
        'السبت': 6

    };


    return map[dayName];

}


// ============================================================
// تنسيق التاريخ بدون UTC
// ============================================================
// مهم جدًا:
// لا نستخدم toISOString()
// لأنها ممكن تحول التاريخ ليوم سابق بسبب فرق التوقيت.
// ============================================================

function formatLocalDate(date) {

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, '0');


    const day =
        String(
            date.getDate()
        ).padStart(2, '0');


    return `${year}-${month}-${day}`;

}


// ============================================================
// إنشاء التواريخ القادمة
// ============================================================

function generateUpcomingDates(dayName) {

    const dates = [];


    const targetDayIndex =
        getDayIndex(dayName);


    const currentDate =
        new Date();


    // تصفير الوقت حتى لا يدخل UTC في الحساب
    currentDate.setHours(
        12,
        0,
        0,
        0
    );


    // 60 يوم تقريبًا شهرين
    for (
        let i = 0;
        i < 60;
        i++
    ) {

        if (
            currentDate.getDay() ===
            targetDayIndex
        ) {

            // استخدام التاريخ المحلي الحقيقي
            const formatted =
                formatLocalDate(
                    currentDate
                );


            const displayFormatted =
                `${dayName} (${formatted})`;


            dates.push({

                value:
                    displayFormatted,

                text:
                    displayFormatted

            });

        }


        currentDate.setDate(
            currentDate.getDate() + 1
        );

    }


    return dates;

}


// ============================================================
// جلب المواعيد المحجوزة من Google Sheet
// ============================================================

async function getBookedSlots(
    branch,
    date
) {

    try {

        const url =
            SITE_API_URL +
            '?action=getBookedSlots' +
            '&branch=' +
            encodeURIComponent(branch) +
            '&date=' +
            encodeURIComponent(date);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                'HTTP Error: ' +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            result &&
            Array.isArray(result.times)
        ) {

            return result.times;

        }


        return [];

    }

    catch (error) {

        console.error(
            'خطأ في جلب المواعيد المحجوزة:',
            error
        );

        return [];

    }

}


// ============================================================
// توحيد شكل الوقت
// ============================================================

function normalizeTime(time) {

    if (
        time === null ||
        time === undefined ||
        time === ''
    ) {

        return '';

    }


    // لو Google Sheet رجع Date
    if (
        Object.prototype.toString
            .call(time) ===
        '[object Date]'
    ) {

        return minutesToTimeStr(
            time.getHours() * 60 +
            time.getMinutes()
        );

    }


    let value =
        String(time)
            .trim()
            .replace(/\s+/g, ' ');


    // توحيد بعض الاختلافات
    value =
        value
            .replace(/صباحًا/g, 'ص')
            .replace(/مساءً/g, 'م')
            .replace(/مساء/g, 'م')
            .replace(/صباح/g, 'ص');


    return value;

}


// ============================================================
// عند اختيار الفرع
// ============================================================

document
    .getElementById('branch')
    .addEventListener(
        'change',
        function () {

            const branch =
                this.value;


            const daySelect =
                document.getElementById(
                    'day'
                );


            const dateSelect =
                document.getElementById(
                    'bookingDate'
                );


            const timeSelect =
                document.getElementById(
                    'time'
                );


            const phoneDisplay =
                document.getElementById(
                    'branchPhoneDisplay'
                );


            const phoneSpan =
                document.getElementById(
                    'phoneNumberDisplay'
                );


            const selected =
                this.options[
                    this.selectedIndex
                ];


            const phone =
                selected.getAttribute(
                    'data-phone'
                );


            if (phone) {

                phoneSpan.textContent =
                    phone;

                phoneDisplay.style.display =
                    'flex';

            }

            else {

                phoneDisplay.style.display =
                    'none';

            }


            // تصفير الاختيارات
            daySelect.innerHTML =
                '<option value="">-- اختر اليوم أولاً --</option>';

            daySelect.disabled = true;


            dateSelect.innerHTML =
                '<option value="">-- اختر يوم العمل أولاً --</option>';

            dateSelect.disabled = true;


            timeSelect.innerHTML =
                '<option value="">-- اختر تاريخ الحجز أولاً --</option>';

            timeSelect.disabled = true;


            if (
                !branch ||
                !branchDays[branch]
            ) {

                return;

            }


            const days =
                branchDays[branch];


            if (!days.length) {

                return;

            }


            daySelect.disabled =
                false;


            daySelect.innerHTML =
                '<option value="">-- اختر اليوم --</option>';


            days.forEach(day => {

                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    day;


                option.textContent =
                    day;


                daySelect.appendChild(
                    option
                );

            });

        }
    );


// ============================================================
// عند اختيار اليوم
// ============================================================

document
    .getElementById('day')
    .addEventListener(
        'change',
        function () {

            const day =
                this.value;


            const dateSelect =
                document.getElementById(
                    'bookingDate'
                );


            const timeSelect =
                document.getElementById(
                    'time'
                );


            dateSelect.innerHTML =
                '<option value="">-- اختر تاريخ الحجز --</option>';

            dateSelect.disabled =
                true;


            timeSelect.innerHTML =
                '<option value="">-- اختر تاريخ الحجز أولاً --</option>';

            timeSelect.disabled =
                true;


            if (!day) {
                return;
            }


            const upcomingDates =
                generateUpcomingDates(
                    day
                );


            if (!upcomingDates.length) {

                dateSelect.innerHTML =
                    '<option value="">لا توجد تواريخ متاحة</option>';

                return;

            }


            dateSelect.disabled =
                false;


            upcomingDates.forEach(d => {

                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    d.value;


                option.textContent =
                    d.text;


                dateSelect.appendChild(
                    option
                );

            });

        }
    );


// ============================================================
// عند اختيار تاريخ الحجز
// ============================================================

document
    .getElementById('bookingDate')
    .addEventListener(
        'change',
        async function () {

            const branch =
                document.getElementById(
                    'branch'
                ).value;


            const day =
                document.getElementById(
                    'day'
                ).value;


            const bookingDate =
                this.value;


            const timeSelect =
                document.getElementById(
                    'time'
                );


            // تنظيف القائمة
            timeSelect.innerHTML =
                '<option value="">جاري تحميل المواعيد...</option>';


            timeSelect.disabled =
                true;


            if (
                !branch ||
                !day ||
                !bookingDate ||
                !branchTimes[branch] ||
                !branchTimes[branch][day]
            ) {

                timeSelect.innerHTML =
                    '<option value="">-- لا توجد مواعيد --</option>';

                return;

            }


            // ====================================================
            // إنشاء كل المواعيد كل 20 دقيقة
            // ====================================================

            const timeRange =
                branchTimes[branch][day];


            const allSlots =
                generateTimeSlots(
                    timeRange,
                    20
                );


            console.log(
                'كل المواعيد:',
                allSlots
            );


            // ====================================================
            // جلب المواعيد المحجوزة
            // ====================================================

            let bookedSlots = [];


            try {

                bookedSlots =
                    await getBookedSlots(
                        branch,
                        bookingDate
                    );

            }

            catch (error) {

                console.error(
                    error
                );

            }


            console.log(
                'المواعيد المحجوزة:',
                bookedSlots
            );


            // ====================================================
            // تحويل الحجوزات إلى Set
            // ====================================================

            const bookedSet =
                new Set(
                    bookedSlots
                        .map(
                            normalizeTime
                        )
                        .filter(Boolean)
                );


            console.log(
                'Booked Set:',
                bookedSet
            );


            // ====================================================
            // حذف المواعيد المحجوزة فقط
            //
            // مثال:
            //
            // الأصل:
            // 6:00
            // 6:20
            // 6:40
            // 7:00
            //
            // لو 6:00 محجوز:
            //
            // 6:20
            // 6:40
            // 7:00
            //
            // بدون تغيير نظام الـ20 دقيقة.
            // ====================================================

            const availableSlots =
                allSlots.filter(
                    slot =>
                        !bookedSet.has(
                            normalizeTime(
                                slot
                            )
                        )
                );


            console.log(
                'المواعيد المتاحة:',
                availableSlots
            );


            // ====================================================
            // عرض المواعيد
            // ====================================================

            timeSelect.innerHTML =
                '<option value="">-- اختر الميعاد --</option>';


            if (
                availableSlots.length === 0
            ) {

                const option =
                    document.createElement(
                        'option'
                    );


                option.value = '';


                option.textContent =
                    'لا توجد مواعيد متاحة في هذا اليوم';


                timeSelect.appendChild(
                    option
                );


                timeSelect.disabled =
                    true;


                return;

            }


            availableSlots.forEach(
                slot => {

                    const option =
                        document.createElement(
                            'option'
                        );


                    option.value =
                        slot;


                    option.textContent =
                        slot;


                    timeSelect.appendChild(
                        option
                    );

                }
            );


            timeSelect.disabled =
                false;

        }
    );


// ============================================================
// إرسال الحجز
// ============================================================

async function submitBooking(e) {

    e.preventDefault();


    const submitBtn =
        document.getElementById(
            'submitBtn'
        );


    const branch =
        document.getElementById(
            'branch'
        );


    const branchName =
        branch.value;


    const branchPhone =
        branch.options[
            branch.selectedIndex
        ].getAttribute(
            'data-phone'
        );


    const bookingDate =
        document.getElementById(
            'bookingDate'
        ).value;


    const timeStr =
        document.getElementById(
            'time'
        ).value;


    const name =
        document.getElementById(
            'name'
        ).value.trim();


    const age =
        document.getElementById(
            'age'
        ).value.trim();


    const phone =
        document.getElementById(
            'phone'
        ).value.trim();


    const notes =
        document.getElementById(
            'notes'
        ).value.trim();


    if (
        !branchName ||
        !bookingDate ||
        !timeStr ||
        !name ||
        !age ||
        !phone
    ) {

        alert(
            'يرجى ملء جميع الحقول المطلوبة بما في ذلك السن.'
        );

        return;

    }


    // منع الضغط مرتين
    submitBtn.disabled =
        true;

    submitBtn.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';


    // ============================================================
    // فحص أخير للمرة الثانية
    // ============================================================

    try {

        const bookedSlots =
            await getBookedSlots(
                branchName,
                bookingDate
            );


        const bookedSet =
            new Set(
                bookedSlots
                    .map(
                        normalizeTime
                    )
                    .filter(Boolean)
            );


        const selectedTime =
            normalizeTime(
                timeStr
            );


        // الموعد اتاخد بالفعل
        if (
            bookedSet.has(
                selectedTime
            )
        ) {

            alert(
                '⚠️ عذرًا، هذا الموعد تم حجزه بالفعل.\n\nيرجى اختيار موعد آخر.'
            );


            // إعادة تحميل قائمة المواعيد
            document
                .getElementById(
                    'bookingDate'
                )
                .dispatchEvent(
                    new Event('change')
                );


            submitBtn.disabled =
                false;


            submitBtn.innerHTML =
                '<i class="fab fa-whatsapp"></i> تأكيد الحجز';


            return;

        }

    }

    catch (error) {

        console.error(
            'خطأ في التحقق من الموعد:',
            error
        );

        alert(
            'تعذر التحقق من توفر الموعد. حاول مرة أخرى.'
        );


        submitBtn.disabled =
            false;


        submitBtn.innerHTML =
            '<i class="fab fa-whatsapp"></i> تأكيد الحجز';


        return;

    }


    // ============================================================
    // بيانات الحجز
    // ============================================================

    const bookingData = {

        branch:
            branchName,

        date:
            bookingDate,

        time:
            timeStr,

        name:
            name,

        age:
            age,

        phone:
            phone,

        notes:
            notes

    };


    // ============================================================
    // إرسال البيانات إلى Google Sheet
    // ============================================================

    try {

        await fetch(
            SITE_API_URL,
            {

                method:
                    'POST',

                mode:
                    'no-cors',

                headers: {

                    'Content-Type':
                        'application/json'

                },

                body:
                    JSON.stringify(
                        bookingData
                    )

            }
        );

    }

    catch (error) {

        console.error(
            'خطأ أثناء إرسال البيانات:',
            error
        );

    }


    // ============================================================
    // رسالة واتساب
    // ============================================================

    let message =
        `مرحباً، أريد تسجيل حجز موعد في فرع ${branchName}:\n`;


    message +=
        `📅 التاريخ: ${bookingDate}\n`;


    message +=
        `⏰ الوقت: ${timeStr}\n`;


    message +=
        `👤 الاسم: ${name}\n`;


    message +=
        `🎂 السن: ${age} سنة\n`;


    message +=
        `📞 رقم الهاتف: ${phone}\n`;


    if (notes) {

        message +=
            `📝 ملاحظات: ${notes}\n`;

    }


    message +=
        `\nأرجو تأكيد الحجز برقم الحجز الخاص بي، شكراً!`;


    const encodedMessage =
        encodeURIComponent(
            message
        );


    const whatsappUrl =
        `https://wa.me/${branchPhone}?text=${encodedMessage}`;


    // فتح واتساب
    window.open(
        whatsappUrl,
        '_blank'
    );


    alert(
        '✅ تم تحويلك للواتساب وإرسال بيانات حجزك بنجاح.'
    );


    // ============================================================
    // إعادة ضبط النموذج
    // ============================================================

    document
        .getElementById(
            'bookingForm'
        )
        .reset();


    document
        .getElementById(
            'day'
        )
        .disabled =
        true;


    document
        .getElementById(
            'bookingDate'
        )
        .disabled =
        true;


    document
        .getElementById(
            'time'
        )
        .disabled =
        true;


    document
        .getElementById(
            'branchPhoneDisplay'
        )
        .style.display =
        'none';


    submitBtn.disabled =
        false;


    submitBtn.innerHTML =
        '<i class="fab fa-whatsapp"></i> تأكيد الحجز';

}

window.onload =
    function () {

        document
            .getElementById(
                'branch'
            )
            .disabled =
            true;


        loadWorkingHours();

    };


// ============================================================
// عداد الزوار
// ============================================================

(function () {

    function updateCounter(data) {

        var el =
            document.getElementById(
                'siteVisitorCounter'
            );


        if (
            el &&
            data &&
            typeof data.count !== 'undefined'
        ) {

            el.textContent =
                data.count.toLocaleString(
                    'ar-EG'
                ) +
                ' زائر';

        }

    }


    window.__visitorCounterCallback =
        updateCounter;


    var pageId =
        window.location.pathname
            .replace(/\//g, '_') ||
        'home';


    var s =
        document.createElement(
            'script'
        );


    s.src =
        SITE_API_URL +
        '?action=trackVisit&page=' +
        encodeURIComponent(
            pageId
        ) +
        '&callback=__visitorCounterCallback';


    document.body.appendChild(
        s
    );

})();

</script>
