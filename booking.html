<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - عيادة دكتور أحمد عبد الرفاعي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #f5f6f8; color: #1e2a3a; line-height: 1.8; direction: rtl; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .booking-card { background: #ffffff; max-width: 600px; width: 100%; padding: 40px 35px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10); border: 1px solid rgba(201, 154, 43, 0.15); }
        .booking-card h1 { font-size: 2rem; font-weight: 900; color: #1a3a60; text-align: center; margin-bottom: 6px; }
        .booking-card h1 i { color: #c99a2b; margin-left: 10px; }
        .booking-card .sub { text-align: center; color: #5a6a7a; font-size: 1rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-weight: 700; color: #1a3a60; margin-bottom: 6px; font-size: 1rem; }
        .form-group label i { color: #c99a2b; margin-left: 8px; width: 20px; }
        .form-group select, .form-group input, .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #e0e4e8; border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 1rem; background: #f5f6f8; transition: 0.3s ease; }
        .form-group select:focus, .form-group input:focus, .form-group textarea:focus { border-color: #c99a2b; outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(201, 154, 43, 0.1); }
        .branch-phone-display { background: #f5f6f8; padding: 10px 16px; border-radius: 12px; margin-top: 6px; font-weight: 600; color: #1a3a60; display: flex; align-items: center; gap: 12px; border-right: 4px solid #c99a2b; }
        .btn-submit { display: block; width: 100%; background: #c99a2b; color: #fff; padding: 16px; border: none; border-radius: 50px; font-weight: 700; font-size: 1.2rem; cursor: pointer; transition: 0.3s ease; box-shadow: 0 6px 20px rgba(201, 154, 43, 0.35); margin-top: 10px; }
        .btn-submit:hover { background: #b0861f; transform: translateY(-3px); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #5a6a7a; font-weight: 600; }
        .back-link a { color: #2a4a7a; text-decoration: none; }
        .note-msg { background: #fff9e6; padding: 12px 18px; border-radius: 12px; border-right: 4px solid #c99a2b; font-size: 0.9rem; color: #5a6a7a; margin-bottom: 20px; }
        .note-msg i { color: #c99a2b; margin-left: 8px; }
        @media (max-width: 550px) { .booking-card { padding: 24px 18px; } .booking-card h1 { font-size: 1.6rem; } }
    </style>
</head>
<body>
    <div class="booking-card">
        <h1><i class="fas fa-calendar-check"></i> حجز موعد</h1>
        <p class="sub">اختر الفرع والموعد المناسب لك</p>
        <div class="note-msg"><i class="fas fa-info-circle"></i> سيتم إرسال بيانات حجزك عبر واتساب لتأكيد الموعد.</div>

        <form id="bookingForm" onsubmit="submitBooking(event)">
            <div class="form-group">
                <label><i class="fas fa-store"></i> اختر الفرع</label>
                <select id="branch" required>
                    <option value="">-- اختر --</option>
                    <option value="أكتوبر" data-phone="201061119615">فرع أكتوبر</option>
                    <option value="فيصل" data-phone="201032444727">فرع فيصل</option>
                </select>
                <div id="branchPhoneDisplay" class="branch-phone-display" style="display:none;"><i class="fas fa-phone"></i><span>رقم الفرع: <span id="phoneNumberDisplay"></span></span></div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calendar-day"></i> اليوم</label>
                <select id="day" required>
                    <option value="">-- اختر الفرع أولاً --</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-clock"></i> الوقت</label>
                <select id="time" required>
                    <option value="">-- اختر اليوم أولاً --</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-user"></i> الاسم الكامل</label>
                <input type="text" id="name" placeholder="أدخل اسمك" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> رقم التليفون</label>
                <input type="tel" id="phone" placeholder="مثال: 01012345678" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-pen"></i> ملاحظات (اختياري)</label>
                <textarea id="notes" placeholder="أي تفاصيل إضافية تريد إخبارنا بها"></textarea>
            </div>

            <button type="submit" class="btn-submit"><i class="fab fa-whatsapp"></i> تأكيد الحجز</button>
        </form>
        <div class="back-link"><a href="index.html"><i class="fas fa-arrow-right"></i> العودة إلى الصفحة الرئيسية</a></div>
    </div>

    <script>
        // الرابط الثابت
        const API_URL = 'https://script.google.com/macros/s/AKfycbzUHh_JfDAR6P9KxKxS9yNTuFPu7eRDarHV5ojwNwI7dPUj3hOFNsm7PZZwz0ywu1RITQ/exec';
        
        let scheduleData = {};

        // عرض رقم الفرع
        document.getElementById('branch').addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            const phone = selected.getAttribute('data-phone');
            const displayDiv = document.getElementById('branchPhoneDisplay');
            const phoneSpan = document.getElementById('phoneNumberDisplay');
            if (phone) { phoneSpan.textContent = phone; displayDiv.style.display = 'flex'; } else { displayDiv.style.display = 'none'; }
        });

        // جلب المواعيد
        async function loadSchedule() {
            try {
                const response = await fetch(`${API_URL}?action=getSchedule`);
                const data = await response.json();
                scheduleData = data;
                document.getElementById('branch').disabled = false;
                
                const currentBranch = document.getElementById('branch').value;
                if (currentBranch) updateDays(currentBranch);
            } catch (error) {
                console.error('خطأ:', error);
                alert('حدث خطأ في تحميل مواعيد العمل.');
            }
        }

        // تحديث الأيام مع تجاهل "مغلق" أو الفاضي
        function updateDays(branch) {
            const daySelect = document.getElementById('day');
            const timeSelect = document.getElementById('time');
            
            daySelect.innerHTML = '<option value="">-- اختر اليوم --</option>';
            timeSelect.innerHTML = '<option value="">-- اختر الوقت --</option>';
            timeSelect.disabled = true;

            if (!branch || !scheduleData[branch]) {
                daySelect.disabled = true;
                daySelect.innerHTML = '<option value="">لا توجد أيام متاحة</option>';
                return;
            }

            // ترشيح الأيام اللي ليها وقت حقيقي فقط
            const days = Object.keys(scheduleData[branch]).filter(day => {
                const time = scheduleData[branch][day];
                return time && time !== 'مغلق' && time.trim() !== '';
            });

            if (days.length === 0) {
                daySelect.disabled = true;
                daySelect.innerHTML = '<option value="">لا توجد أيام متاحة لهذا الفرع</option>';
                return;
            }

            daySelect.disabled = false;
            days.forEach(day => {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day;
                daySelect.appendChild(option);
            });
        }

        // عند تغيير الفرع
        document.getElementById('branch').addEventListener('change', function() {
            const branch = this.value;
            if (branch) updateDays(branch);
            else {
                document.getElementById('day').innerHTML = '<option value="">-- اختر الفرع أولاً --</option>';
                document.getElementById('time').innerHTML = '<option value="">-- اختر الوقت --</option>';
                document.getElementById('time').disabled = true;
            }
        });

        // عند اختيار اليوم
        document.getElementById('day').addEventListener('change', function() {
            const branch = document.getElementById('branch').value;
            const day = this.value;
            const timeSelect = document.getElementById('time');

            timeSelect.innerHTML = '';
            timeSelect.disabled = true;

            if (!branch || !day || !scheduleData[branch] || !scheduleData[branch][day]) {
                timeSelect.innerHTML = '<option value="">-- لا يوجد وقت متاح --</option>';
                return;
            }

            const time = scheduleData[branch][day];
            timeSelect.disabled = false;
            const option = document.createElement('option');
            option.value = time;
            option.textContent = time;
            timeSelect.appendChild(option);
        });

        // إرسال الحجز
        async function submitBooking(e) {
            e.preventDefault();

            const branch = document.getElementById('branch');
            const branchName = branch.value;
            const branchPhone = branch.options[branch.selectedIndex].getAttribute('data-phone');
            const day = document.getElementById('day').value;
            const time = document.getElementById('time').value;
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!branchName || !day || !time || !name || !phone) {
                alert('يرجى ملء جميع الحقول المطلوبة.');
                return;
            }

            const bookingData = { branch: branchName, date: day, time: time, name: name, phone: phone, notes: notes };
            let bookingNumber = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });
                const result = await response.json();

                if (result.success) bookingNumber = result.bookingNumber || 'غير معروف';
                else { alert('خطأ: ' + result.error); return; }
            } catch (error) {
                alert('حدث خطأ في الاتصال بالخادم.');
                return;
            }

            // رسالة واتساب
            let message = `✅ تم تأكيد حجزك في عيادة دكتور أحمد عبد الرفاعي\n━━━━━━━━━━━━━━━━━━━━━━\n🔹 رقم الحجز: #${bookingNumber}\n🏥 الفرع: ${branchName}\n📅 اليوم: ${day}\n⏰ الوقت: ${time}\n👤 الاسم: ${name}\n📞 رقم الهاتف: ${phone}\n📝 ملاحظات: ${notes}\n━━━━━━━━━━━━━━━━━━━━━━\n📌 يرجى الاحتفاظ برقم الحجز لتأكيد موعدك.`;
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${branchPhone}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');

            alert(`✅ تم تسجيل حجزك بنجاح!\n📌 رقم الحجز: #${bookingNumber}`);
        }

        // تشغيل
        window.onload = function() {
            document.getElementById('branch').disabled = true;
            loadSchedule();
        };
    </script>
</body>
</html>
